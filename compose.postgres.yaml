# PI4-241: ambiente PostgreSQL isolado; nao cria as tabelas do FolcStore.
name: folcstore-pi4-bd
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-folcstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD em .env.postgres}
      POSTGRES_DB: ${POSTGRES_DB:-folcstore}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_pi4_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  postgres_pi4_dados:
